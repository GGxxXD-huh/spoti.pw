name: Build spoti.pw IPA (local kit)
on:
  workflow_dispatch:
    inputs:
      ipa_asset:
        description: Encrypted source IPA release asset ID
        required: true
        type: string
      kit_asset:
        description: Encrypted local kit release asset ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install injection tools
        run: |
          brew install ldid
          python3 -m pip install --break-system-packages cryptography requests git+https://github.com/asdfzxcvbn/pyzule-rw.git
      - name: Assemble and validate the full kit
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KEY: ${{ secrets.CODEX_SPOTI_BUILD_KEY }}
          IPA_ASSET: ${{ inputs.ipa_asset }}
          KIT_ASSET: ${{ inputs.kit_asset }}
        run: python3 .github/scripts/build_local_kit.py
      - uses: actions/upload-artifact@v5
        with:
          name: spoti-0.51.0-local-kit-encrypted
          path: |
            out/*.ipa.aes
            out/build-summary.json
          retention-days: 7
          if-no-files-found: error
