name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          curl -fsSL "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in
            application/zip|application/x-ios-app) ;;
            *) echo "::error::Not an IPA"; exit 1 ;;
          esac

      - name: Inject spotifyglass dylib
        run: |
          DYLIB="spotifyglass-plus-ui-unlocked.dylib"
          if [ ! -f "$DYLIB" ]; then
            echo "::error::Dylib not found in repository root: $DYLIB"
            exit 1
          fi
          mkdir -p out
          cyan -i ipa/spotify.ipa -o out/spotify-custom.ipa -f "$DYLIB"

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: spoti.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="spotifyglass-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$f" \
              "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
